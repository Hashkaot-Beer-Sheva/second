<div id="root"></div><link rel="stylesheet" href="/src/responsive.css"><link rel="stylesheet" href="/src/source-switcher.css"><link rel="stylesheet" href="/src/directory.css"><link rel="stylesheet" href="/src/ownership.css"><link rel="stylesheet" href="/src/detail.css"><link rel="stylesheet" href="/src/colors.css"><div id="source-switcher"><span>Data source</span><button data-source="local">Local CSVs</button><button data-source="cloud">Cloudflare R2</button></div><script>const originalFetch=window.fetch;window.fetch=(input,init)=>{if(String(input)==='/api/data'&&localStorage.getItem('propertyDataSource')==='local')input='/api/local-data';return originalFetch(input,init)};document.querySelectorAll('#source-switcher button').forEach(b=>b.onclick=()=>{localStorage.setItem('propertyDataSource',b.dataset.source==='local'?'local':'cloud');location.reload()});</script><script type="module" src="/src/main.jsx"></script>
