<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>Hashkaot Darom</title>
    <link rel="stylesheet" href="/src/responsive.css" />
    <link rel="stylesheet" href="/src/source-switcher.css" />
    <link rel="stylesheet" href="/src/directory.css" />
    <link rel="stylesheet" href="/src/ownership.css" />
    <link rel="stylesheet" href="/src/detail.css" />
    <link rel="stylesheet" href="/src/colors.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <div id="source-switcher"><span>Data source</span><button data-source="local">Local CSVs</button><button data-source="cloud">Cloudflare R2</button></div>
    <script>
      const originalFetch = window.fetch;
      window.fetch = (input, init) => {
        if (String(input) === '/api/data' && location.hostname === 'localhost' && localStorage.getItem('propertyDataSource') === 'local') input = '/api/local-data';
        return originalFetch(input, init);
      };
      document.querySelectorAll('#source-switcher button').forEach(button => button.onclick = () => {
        localStorage.setItem('propertyDataSource', button.dataset.source === 'local' ? 'local' : 'cloud');
        location.reload();
      });
    </script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => {
          reg.update();
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) worker.postMessage({ type: 'SKIP_WAITING' });
            });
          });
        }).catch(() => {});
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
